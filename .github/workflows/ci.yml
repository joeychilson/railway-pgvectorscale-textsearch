name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Check shell syntax
        run: |
          bash -n entrypoint.sh
          bash -n pgtext-lib.sh
          bash -n zz-init-textsearch.sh
          bash -n test/smoke-test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: railway-pgvectorscale-textsearch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: ./test/smoke-test.sh railway-pgvectorscale-textsearch:test
