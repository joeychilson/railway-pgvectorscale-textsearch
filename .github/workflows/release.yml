name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: auto releases only when the image changed
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: joeychilson/railway-templates/.github/workflows/release.yml@main
    with:
      bump: ${{ inputs.bump || 'auto' }}
      # Deployments made before the repo was renamed still pull this name.
      extra-images: ghcr.io/joeychilson/railway-pg-vectorscale-textsearch
