name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must be vX.Y.Z or X.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read extension versions
        id: upstream
        run: |
          vectorscale="$(sed -n 's/^ARG PGVECTORSCALE_VERSION=//p' Dockerfile)"
          textsearch="$(sed -n 's/^ARG PG_TEXTSEARCH_VERSION=//p' Dockerfile)"
          if ! printf '%s' "$vectorscale" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected PGVECTORSCALE_VERSION: $vectorscale" >&2
            exit 1
          fi
          if ! printf '%s' "$textsearch" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unexpected PG_TEXTSEARCH_VERSION: $textsearch" >&2
            exit 1
          fi
          echo "vectorscale=$vectorscale" >> "$GITHUB_OUTPUT"
          echo "textsearch=$textsearch" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build test image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          tags: railway-pgvectorscale-textsearch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: ./test/smoke-test.sh railway-pgvectorscale-textsearch:test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          # Keep publishing the previous package name for existing templates.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/joeychilson/railway-pg-vectorscale-textsearch
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=pgvectorscale and pg_textsearch on Railway
            org.opencontainers.image.description=PostgreSQL vector, BM25, and hybrid search for Railway
            io.railway.template.pgvectorscale-version=${{ steps.upstream.outputs.vectorscale }}
            io.railway.template.pg-textsearch-version=${{ steps.upstream.outputs.textsearch }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
